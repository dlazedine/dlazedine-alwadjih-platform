<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعديل المقال - ركن الكتابة الهادفة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    :root { --primary: #0e2744; --gold: #c49b3f; --bg-body: #faf7ef; --text-dark: #152238; --text-muted: #5d6b7b; --border-color: #d9ceb4; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Tajawal', sans-serif; background-color: var(--bg-body); color: var(--text-dark); line-height: 1.8;
        background-image: radial-gradient(circle at 50% 0%, rgba(196,155,63,0.12) 0%, transparent 60%), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><defs><pattern id='islamic-dash' width='80' height='80' patternUnits='userSpaceOnUse'><g fill='none' stroke='%23c49b3f' stroke-width='0.6' opacity='0.15'><path d='M40 16 L47 27 L60 20 L57 34 L71 39 L60 48 L68 60 L54 61 L51 75 L40 66 L29 75 L26 61 L12 60 L20 48 L9 39 L23 34 L20 20 L33 27 Z'/></g></pattern></defs><rect width='80' height='80' fill='url(%23islamic-dash)'/></svg>");
        background-attachment: fixed; padding-bottom: 60px;
    }
    /* الترويسة العلوية */
    .top-bar { background: linear-gradient(135deg, #091c33, #0e2744); color: #f7e7c4; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); flex-wrap: wrap; gap: 10px;}
    .top-bar a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; background: rgba(196,155,63,0.2); padding: 6px 14px; border-radius: 7px; border: 1px solid var(--gold); transition: 0.2s;}
    .top-bar a:hover { background: var(--gold); color: #091c33; }

    .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .form-card { background: #fff; border-radius: 16px; border-top: 5px solid var(--gold); box-shadow: 0 6px 20px rgba(14,39,68,0.08); padding: 30px 40px; position: relative; }
    
    .close-btn { position: absolute; top: 15px; left: 15px; background: #f8d7da; color: #721c24; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none;}
    .close-btn:hover { background: #f5c6cb; }

    h1 { font-family: 'Amiri', serif; color: var(--primary); font-size: 28px; margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    
    .note-box { display: none; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 700; }
    .note-box.active { display: block; }

    .field-group { margin-bottom: 20px; }
    .field-group label { display: block; font-size: 13.5px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .field-group input, .field-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 14px; background: #fdfcf8; }
    .field-group textarea { min-height: 250px; resize: vertical; line-height: 1.8; }
    
    .media-upload-area { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .upload-box { border: 2px dashed var(--border-color); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .upload-box:hover { border-color: var(--gold); background: #fffdf8; }
    .upload-box input[type="file"] { display: none; }
    .upload-box i { font-size: 24px; color: var(--gold); margin-bottom: 10px; }
    .upload-box span { display: block; font-size: 12px; color: var(--text-muted); }
    .preview-img { max-width: 100%; max-height: 100px; margin-top: 10px; border-radius: 5px; display: none; }

    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #0e2744, #153861); color: #fff; border: none; border-radius: 9px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    
    .msg { display: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 13px; margin-top: 15px; }
    .msg.success { background: #d4edda; color: #155724; display: block; }
    .msg.error { background: #f8d7da; color: #721c24; display: block; }
</style>
</head>
<body>

<!-- الترويسة مع زر العودة للوحة التحكم -->
<div class="top-bar">
    <div><i class="fas fa-edit" style="color:var(--gold); margin-left:5px;"></i> تعديل المقال</div>
    <div style="display:flex; gap:10px;">
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
        <a href="sahafa.html"><i class="fas fa-arrow-right"></i> العودة للركن</a>
    </div>
</div>

<div class="container">
    <div class="form-card">
        <!-- زر الإغلاق (X) في الزاوية -->
        <a href="sahafa.html" class="close-btn" title="إلغاء والعودة">&times;</a>

        <h1>تعديل المقال</h1>
        <p class="subtitle">يمكنك تعديل مقالك بناءً على ملاحظات المفتش.</p>

        <div class="note-box" id="adminNoteBox">
            <i class="fas fa-info-circle"></i> <strong>ملاحظة المفتش:</strong> <span id="adminNoteText"></span>
        </div>

        <form id="editForm">
            <input type="hidden" id="articleId" value="">
            
            <div class="field-group">
                <label>عنوان المقال</label>
                <input type="text" id="title" required>
            </div>
            <div class="field-group">
                <label>نص المقال</label>
                <textarea id="content" required></textarea>
            </div>

            <div class="media-upload-area">
                <div class="field-group">
                    <label>صورة الغلاف</label>
                    <label class="upload-box" for="coverFile">
                        <i class="fas fa-image"></i>
                        <span>انقر لرفع صورة جديدة</span>
                        <input type="file" id="coverFile" accept="image/*">
                        <img id="coverPreview" class="preview-img" src="" alt="معاينة">
                    </label>
                </div>
                <div class="field-group">
                    <label>فيديو (اختياري)</label>
                    <label class="upload-box" for="videoFile">
                        <i class="fas fa-video"></i>
                        <span>انقر لرفع فيديو جديد</span>
                        <input type="file" id="videoFile" accept="video/*">
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-save"></i> حفظ التعديلات وإعادة الإرسال للمراجعة</button>
            <div class="msg" id="formMsg"></div>
        </form>
    </div>
</div>

<!-- استدعاء ملف الجافاسكريبت -->
<script src="sahafa-edit.js"></script>
</body>
</html>
