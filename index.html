<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الوجيه في الإشراف التربوي - تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Tajawal', sans-serif;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background-color: #faf7ef; padding: 20px;
        background-image: 
            radial-gradient(circle at 50% 0%, rgba(196,155,63,0.12) 0%, transparent 60%),
            url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><defs><pattern id='islamic-dash' width='80' height='80' patternUnits='userSpaceOnUse'><g fill='none' stroke='%23c49b3f' stroke-width='0.6' opacity='0.22'><path d='M40 16 L47 27 L60 20 L57 34 L71 39 L60 48 L68 60 L54 61 L51 75 L40 66 L29 75 L26 61 L12 60 L20 48 L9 39 L23 34 L20 20 L33 27 Z'/><rect x='28' y='28' width='24' height='24' rx='2'/><rect x='28' y='28' width='24' height='24' rx='2' transform='rotate(45 40 40)'/><circle cx='0' cy='0' r='14'/><circle cx='80' cy='0' r='14'/><circle cx='0' cy='80' r='14'/><circle cx='80' cy='80' r='14'/></g></pattern></defs><rect width='80' height='80' fill='url(%23islamic-dash)'/></svg>");
        background-attachment: fixed;
    }
    .login-card {
        background: #fff; border-radius: 20px; padding: 40px 30px; max-width: 420px; width: 100%;
        box-shadow: 0 15px 50px rgba(14,39,68,0.12); border-top: 3.5px solid #c49b3f;
        position: relative;
    }
    .logo-shield {
        width: 65px; height: 65px; margin: 0 auto 18px; border-radius: 16px;
        background: linear-gradient(135deg, #faf7ef, #f4eedd); border: 2px solid #c49b3f;
        display: flex; align-items: center; justify-content: center; font-size: 26px; color: #8c6423;
    }
    h1 { font-family: 'Amiri', serif; text-align: center; font-size: 26px; color: #0e2744; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #5d6b7b; font-size: 12.5px; margin-bottom: 24px; }
    .error-box {
        display: none; background: #fbeceb; color: #8b1827; padding: 10px 14px; border-radius: 9px;
        font-size: 12.5px; text-align: center; margin-bottom: 16px; border: 1px solid #f5c6c6;
    }
    .field-group { margin-bottom: 14px; }
    .field-group label { display: block; font-size: 12.5px; font-weight: 700; color: #0e2744; margin-bottom: 5px; }
    .field-group input {
        width: 100%; padding: 11px 14px; border: 1.5px solid #d9ceb4; border-radius: 9px;
        font-family: inherit; font-size: 13.5px; transition: all 0.2s; background: #fdfcf8;
    }
    .field-group input:focus { outline: none; border-color: #c49b3f; background: #fff; }
    .login-btn {
        width: 100%; padding: 12px; margin-top: 6px; border: none; border-radius: 9px;
        background: linear-gradient(135deg, #0e2744, #153861); color: #fff;
        font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
        transition: all 0.22s; box-shadow: 0 4px 12px rgba(14,39,68,0.25);
    }
    .login-btn:hover { transform: translateY(-1.5px); box-shadow: 0 6px 16px rgba(14,39,68,0.35); }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .install-link {
        display: block; text-align: center; margin-top: 18px; color: #0e2744;
        font-size: 12px; text-decoration: none; font-weight: 700;
    }
    .install-link:hover { color: #c49b3f; }
    .debug { font-size: 10.5px; color: #5d6b7b; text-align: center; margin-top: 12px; word-break: break-all; }
</style>
</head>
<body>

<div class="login-card">
    <div class="logo-shield"><i class="fas fa-shield-halved"></i></div>
    <h1>الوجيه في الإشراف التربوي</h1>
    <p class="subtitle">المقاطعة الثانية قسنطينة – المفتشية العامة</p>

    <div class="error-box" id="loginError"></div>

    <form id="loginForm">
        <div class="field-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" autocomplete="username" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="field-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
        </div>
        <button type="submit" class="login-btn" id="loginBtn">دخول المنظومة</button>
    </form>

    <a href="#" class="install-link"><i class="fas fa-download"></i> تثبيت التطبيق على هاتفك</a>
    <div class="debug" id="debugInfo"></div>
</div>

<script>
// ============================================================
//  كل شيء داخل هذه الصفحة - لا حاجة لملفات خارجية
// ============================================================

const firebaseConfig = {
    apiKey: "AIzaSyBdv2RJ7EzlnVQcXyyozlLhVKdgwaKQdaY",
    authDomain: "mou3ladja.firebaseapp.com",
    projectId: "mou3ladja",
    storageBucket: "mou3ladja.firebasestorage.app",
    messagingSenderId: "986880549463",
    appId: "1:986880549463:web:b4de098099622040bfb912"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ---------- دالة تشفير كلمة المرور ----------
async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password + 'pgb_salt_2026');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---------- دالة تسجيل الدخول ----------
async function login(username, password) {
    try {
        // 1. التأكد من الاتصال المجهول
        if (!auth.currentUser) {
            await auth.signInAnonymously();
        }

        // 2. جلب المستخدمين
        const usersDoc = await db.collection('platform_shared').doc('users').get();
        if (!usersDoc.exists) throw new Error('لا توجد حسابات مسجلة في قاعدة البيانات');
        const users = usersDoc.data().list || [];
        if (users.length === 0) throw new Error('قائمة المستخدمين فارغة');

        // 3. البحث عن المستخدم
        const user = users.find(u => u.username && u.username.toLowerCase() === username.toLowerCase());
        if (!user) throw new Error('اسم المستخدم غير موجود');
        if (user.active === false) throw new Error('هذا الحساب معطل');

        // 4. جلب كلمات المرور المشفرة
        const credsDoc = await db.collection('platform_shared').doc('credentials').get();
        if (!credsDoc.exists) throw new Error('قاعدة كلمات المرور غير موجودة');
        const hashes = credsDoc.data().hashes || {};
        const storedHash = hashes[user.id];
        if (!storedHash) throw new Error('لم يتم تعيين كلمة مرور لهذا الحساب. تواصل مع المفتش.');

        // 5. التحقق من كلمة المرور
        const inputHash = await hashPassword(password);
        if (inputHash !== storedHash) throw new Error('كلمة المرور غير صحيحة');

        // 6. تحديث آخر دخول
        user.lastLogin = new Date().toISOString();
        const updatedUsers = users.map(u => u.id === user.id ? user : u);
        await db.collection('platform_shared').doc('users').set({ 
            list: updatedUsers, updatedAt: new Date().toISOString() 
        });

        // 7. حفظ الجلسة
        const session = { user: user, expiresAt: Date.now() + (24 * 60 * 60 * 1000) };
        localStorage.setItem('pgb_session_persistent', JSON.stringify(session));
        sessionStorage.setItem('pgb_session', JSON.stringify(session));

        return { success: true, user: user };
    } catch (error) {
        console.error('Login error:', error);
        return { success: false, message: error.message };
    }
}

// ---------- معالج النموذج ----------
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    errorBox.style.display = 'none';

    if (!username || !password) {
        errorBox.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور';
        errorBox.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'جارٍ التحقق...';

    const result = await login(username, password);

    if (result.success) {
        // التوجيه حسب الدور
        if (result.user.role === 'inspector') {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'moualaja.html';
        }
    } else {
        errorBox.textContent = result.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'دخول المنظومة';
    }
});

// ---------- تشخيص (اختياري) ----------
window.addEventListener('load', async () => {
    try {
        await auth.signInAnonymously();
        const credsDoc = await db.collection('platform_shared').doc('credentials').get();
        const usersDoc = await db.collection('platform_shared').doc('users').get();
        const credsCount = credsDoc.exists ? Object.keys(credsDoc.data().hashes || {}).length : 0;
        const usersCount = usersDoc.exists ? (usersDoc.data().list || []).length : 0;
        document.getElementById('debugInfo').textContent = 
            `مستخدمون: ${usersCount} | كلمات مرور: ${credsCount}`;
    } catch(e) {
        document.getElementById('debugInfo').textContent = 'خطأ في الاتصال: ' + e.message;
    }
});
</script>

</body>
</html>
