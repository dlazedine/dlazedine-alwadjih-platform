<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إرسال مقال - ركن الكتابة الهادفة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root { --primary: #0e2744; --gold: #c49b3f; --bg-body: #faf7ef; --text-dark: #152238; --text-muted: #5d6b7b; --border-color: #d9ceb4; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-body); color: var(--text-dark); line-height: 1.8; background-image: radial-gradient(circle at 50% 0%, rgba(196,155,63,0.12) 0%, transparent 60%), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><defs><pattern id='islamic-dash' width='80' height='80' patternUnits='userSpaceOnUse'><g fill='none' stroke='%23c49b3f' stroke-width='0.6' opacity='0.15'><path d='M40 16 L47 27 L60 20 L57 34 L71 39 L60 48 L68 60 L54 61 L51 75 L40 66 L29 75 L26 61 L12 60 L20 48 L9 39 L23 34 L20 20 L33 27 Z'/></g></pattern></defs><rect width='80' height='80' fill='url(%23islamic-dash)'/></svg>"); background-attachment: fixed; padding-bottom: 60px; }
    .top-bar { background: linear-gradient(135deg, #091c33, #0e2744); color: #f7e7c4; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
    .top-bar a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; background: rgba(196,155,63,0.2); padding: 6px 14px; border-radius: 7px; border: 1px solid var(--gold); transition: 0.2s;}
    .top-bar a:hover { background: var(--gold); color: #091c33; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .form-card { background: #fff; border-radius: 16px; border-top: 5px solid var(--gold); box-shadow: 0 6px 20px rgba(14,39,68,0.08); padding: 30px 40px; }
    h1 { font-family: 'Amiri', serif; color: var(--primary); font-size: 28px; margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
    .field-group { margin-bottom: 20px; }
    .field-group label { display: block; font-size: 13.5px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .field-group input, .field-group select, .field-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 14px; background: #fdfcf8; }
    .field-group textarea { min-height: 250px; resize: vertical; line-height: 1.8; }
    .media-upload-area { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .upload-box { border: 2px dashed var(--border-color); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .upload-box:hover { border-color: var(--gold); background: #fffdf8; }
    .upload-box input[type="file"] { display: none; }
    .upload-box i { font-size: 24px; color: var(--gold); margin-bottom: 10px; }
    .upload-box span { display: block; font-size: 12px; color: var(--text-muted); }
    .preview-img { max-width: 100%; max-height: 100px; margin-top: 10px; border-radius: 5px; display: none; }
    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #0e2744, #153861); color: #fff; border: none; border-radius: 9px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .msg { display: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 13px; margin-top: 15px; }
    .msg.success { background: #d4edda; color: #155724; display: block; }
    .msg.error { background: #f8d7da; color: #721c24; display: block; }
</style>
</head>
<body>

<div class="top-bar">
    <div><i class="fas fa-feather-alt" style="color:var(--gold); margin-left:5px;"></i> إرسال مقال جديد</div>
    <a href="sahafa.html"><i class="fas fa-arrow-right"></i> العودة للركن</a>
</div>

<div class="container">
    <div class="form-card">
        <h1>شارك إبداعك</h1>
        <p class="subtitle">سيتم مراجعة مقالك من طرف المفتشية قبل نشره في الركن.</p>

        <form id="articleForm">
            <div class="field-group">
                <label>عنوان المقال <span style="color:red">*</span></label>
                <input type="text" id="title" required placeholder="اكتب عنواناً جذاباً لمقالك...">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="field-group">
                    <label>التصنيف <span style="color:red">*</span></label>
                    <select id="category" required>
                        <option value="">اختر التصنيف...</option>
                        <option value="adab">أدب</option>
                        <option value="bida">بيداغوجيا</option>
                        <option value="chaan">شأن تربوي</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>الاسم الكامل للكاتب <span style="color:red">*</span></label>
                    <input type="text" id="authorName" required placeholder="مثال: محمد بن علي">
                </div>
            </div>
            <div class="field-group">
                <label>مقدمة قصيرة (تظهر في البطاقة)</label>
                <input type="text" id="excerpt" placeholder="جملة أو جملتين تلخصان المقال (اختياري)...">
            </div>
            <div class="field-group">
                <label>نص المقال <span style="color:red">*</span></label>
                <textarea id="content" required placeholder="اكتب نص مقالك هنا..."></textarea>
            </div>
            <div class="media-upload-area">
                <div class="field-group">
                    <label>صورة الغلاف (اختياري)</label>
                    <label class="upload-box" for="coverFile">
                        <i class="fas fa-image"></i>
                        <span>انقر لرفع صورة من حاسوبك</span>
                        <input type="file" id="coverFile" accept="image/*">
                        <img id="coverPreview" class="preview-img" src="" alt="معاينة">
                    </label>
                </div>
                <div class="field-group">
                    <label>فيديو (اختياري)</label>
                    <label class="upload-box" for="videoFile">
                        <i class="fas fa-video"></i>
                        <span>انقر لرفع فيديو من حاسوبك</span>
                        <input type="file" id="videoFile" accept="video/*">
                    </label>
                </div>
            </div>
            <div class="field-group">
                <label>نبذة عنك (اختياري)</label>
                <input type="text" id="authorBio" placeholder="مثال: أستاذ اللغة العربية بمتوسطة النصر، مهتم بالشعر...">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-paper-plane"></i> إرسال المقال للمراجعة</button>
            <div class="msg" id="formMsg"></div>
        </form>
    </div>
</div>

<script>
const SUPABASE_URL = "https://yzxyttieobyblznaehcl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JE7zHZ97cZ92gUALD0II-w_j04eEo2u";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// معاينة الصورة
document.getElementById('coverFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            const preview = document.getElementById('coverPreview');
            preview.src = evt.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
});

document.getElementById('articleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('formMsg');
    const title = document.getElementById('title').value.trim();
    const category = document.getElementById('category').value;
    const authorName = document.getElementById('authorName').value.trim();
    const excerpt = document.getElementById('excerpt').value.trim();
    const content = document.getElementById('content').value.trim();
    const authorBio = document.getElementById('authorBio').value.trim();
    const coverFile = document.getElementById('coverFile').files[0];
    const videoFile = document.getElementById('videoFile').files[0];

    if (!title || !category || !authorName || !content) {
        msg.className = 'msg error'; msg.textContent = 'يرجى ملء جميع الحقول الإلزامية.'; return;
    }

    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الإرسال...';
    msg.className = 'msg'; msg.style.display = 'none';

    try {
        let coverUrl = null;
        let videoUrl = null;

        // رفع الصورة
        if (coverFile) {
            msg.textContent = '⏳ جارٍ رفع الصورة...';
            const fileExt = coverFile.name.split('.').pop();
            const fileName = `cover_${Date.now()}.${fileExt}`;
            const { error: uploadError } = await sb.storage.from('sahafa_media').upload(fileName, coverFile);
            if (uploadError) throw uploadError;
            const { data: urlData } = sb.storage.from('sahafa_media').getPublicUrl(fileName);
            coverUrl = urlData.publicUrl;
        }

        // رفع الفيديو
        if (videoFile) {
            msg.textContent = '⏳ جارٍ رفع الفيديو...';
            const fileExt = videoFile.name.split('.').pop();
            const fileName = `video_${Date.now()}.${fileExt}`;
            const { error: uploadError } = await sb.storage.from('sahafa_media').upload(fileName, videoFile);
            if (uploadError) throw uploadError;
            const { data: urlData } = sb.storage.from('sahafa_media').getPublicUrl(fileName);
            videoUrl = urlData.publicUrl;
        }

        // حفظ المقال
        const { error } = await sb.from('sahafa_articles').insert([{
            title, category, author_name: authorName,
            excerpt: excerpt || content.substring(0, 100),
            content, cover_image_url: coverUrl, video_url: videoUrl,
            author_bio: authorBio || null, status: 'pending'
        }]);

        if (error) throw error;

        msg.className = 'msg success';
        msg.textContent = '✅ تم إرسال مقالك بنجاح! سيتم مراجعته قريباً.';
        document.getElementById('articleForm').reset();
        document.getElementById('coverPreview').style.display = 'none';
    } catch (err) {
        console.error(err);
        msg.className = 'msg error';
        msg.textContent = '❌ حدث خطأ: ' + err.message;
    } finally {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال المقال للمراجعة';
    }
});
</script>
</body>
</html>
