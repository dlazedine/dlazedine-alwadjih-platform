<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f3864"><title>لا يوجد اتصال — الوجيه</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f1ea;font-family:Tahoma,Arial,sans-serif;color:#1f2a44;text-align:center}.c{max-width:420px;padding:28px;background:#fff;border:1px solid #ddd5bd;border-top:5px solid #c49b3f;border-radius:16px}h1{color:#1f3864;font-size:1.3rem}p{line-height:1.9}.s{font-size:.9rem;color:#6b7280}button{background:#1f3864;color:#fff;border:0;border-radius:10px;padding:9px 22px;font:inherit;cursor:pointer}</style></head>
<body><div class="c"><div style="font-size:2.6rem">📡</div><h1>لا يوجد اتصال بالإنترنت</h1><p id="m">تعذّر فتح هذه الصفحة لأنها لم تُحفظ على جهازك بعد. الصفحات التي فتحتَها من قبل تعمل دون اتصال، أما البيانات (الحسابات والتقارير والنقاش) فتحتاج إلى الإنترنت.</p><p class="s" id="a"></p><button onclick="location.reload()">إعادة المحاولة</button> <button onclick="history.length>1?history.back():location.href='index.html'" style="background:transparent;color:#1f3864;border:1px solid #1f3864">رجوع</button></div><script>const m=document.getElementById("a");if(navigator.onLine){m.textContent="يبدو أنك متصل، لكن الخادم لم يردّ. أعد المحاولة بعد لحظات."}addEventListener("online",()=>{m.textContent="عاد الاتصال، جارٍ إعادة التحميل...";setTimeout(()=>location.reload(),600)})</script></body></html>
