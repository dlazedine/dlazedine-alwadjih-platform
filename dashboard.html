<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - إدارة الحسابات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --navy: #0f2544;
      --navy-2: #122d4a;
      --gold: #d5b35d;
      --gold-soft: #efe3be;
      --bg: #f1eee7;
      --card: #f8f7f4;
      --panel: #ffffff;
      --line: #d9ccb0;
      --text: #1f2d3d;
      --muted: #5d6978;
      --green: #1a7b47;
      --red: #a5313d;
      --blue: #1b5da8;
      --purple: #6a4aa7;
      --shadow: 0 4px 18px rgba(15, 37, 68, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(circle at 20% 10%, rgba(213,179,93,0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(15,37,68,0.06), transparent 28%),
        linear-gradient(180deg, #f4f1ea 0%, #f5f3ee 100%);
    }

    .topbar {
      background: linear-gradient(180deg, #0d223d 0%, #112f4d 100%);
      color: #fff;
      border-bottom: 2px solid var(--gold);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-chip {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(213,179,93,0.8);
      color: #f9e7ba;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-chip.active {
      background: linear-gradient(180deg, #d7b867 0%, #c69a2a 100%);
      color: #0f2544;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f9e7ba;
    }

    .icon-square {
      width: 20px; height: 20px;
      border-radius: 6px;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(213,179,93,0.8);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 12px;
      gap: 16px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.28);
      border-radius: 12px;
      padding: 10px 14px;
      min-height: 100px;
      flex: 1;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(180deg, #091f37 0%, #102d4a 100%);
      color: var(--gold);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .district-label {
      font-weight: 700;
      font-size: 12px;
      color: var(--navy);
      line-height: 1.6;
    }

    .district-label strong {
      color: var(--navy);
    }

    .header-title {
      text-align: center;
      flex: 1;
      padding: 10px 0;
    }

    .header-title h1 {
      margin: 0;
      font-family: 'Amiri', serif;
      font-size: clamp(25px, 4vw, 40px);
      line-height: 1.2;
      color: var(--navy);
      font-weight: 700;
    }

    .header-title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .header-user {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 180px;
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.22);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 12px;
      color: var(--navy);
      font-weight: 700;
    }

    .user-pill .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #dfeaf7;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #b2c9df;
    }

    .subnav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 0;
      flex-wrap: wrap;
      border-top: 1px solid rgba(15,37,68,0.1);
      border-bottom: 1px solid rgba(15,37,68,0.15);
      background: rgba(255,255,255,0.12);
    }

    .subnav a {
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .subnav a.active {
      background: rgba(213,179,93,0.12);
      border: 1px solid rgba(213,179,93,0.8);
      color: var(--navy);
    }

    .page-shell {
      max-width: 1180px;
      margin: 18px auto 30px;
      padding: 0 14px;
    }

    .panel {
      background: rgba(255,255,255,0.58);
      border: 1px solid var(--line);
      border-top: 3px solid var(--gold);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px 18px 18px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 18px;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .panel-sub {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px auto 20px;
      text-align: center;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: 0.2s ease;
      box-shadow: 0 2px 8px rgba(15,37,68,0.08);
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-green { background: linear-gradient(180deg, #1e874d 0%, #176b3d 100%); color: #fff; }
    .btn-blue { background: linear-gradient(180deg, #1f5da4 0%, #163e6e 100%); color: #fff; }
    .btn-gold { background: linear-gradient(180deg, #d8b75a 0%, #b88c25 100%); color: #102945; }
    .btn-amber { background: linear-gradient(180deg, #d1b362 0%, #b38d2e 100%); color: #102945; }
    .btn-outline {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line);
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .user-card .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(180deg, #e7edf5 0%, #dbeaf7 100%);
      border: 1px solid #c4d1e2;
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
      margin: 0;
    }

    .tag {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .tag.inspector { background: #f5e7bc; color: #7e5d17; border-color: #d7b969; }
    .tag.teacher { background: #dae7f8; color: #214f85; border-color: #b5cbf1; }
    .tag.supervisor { background: #e8e5ff; color: #5143a9; border-color: #beb4f8; }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-btn {
      border: 1px solid var(--line);
      background: #f4f0e8;
      color: var(--navy);
      border-radius: 8px;
      height: 28px;
      width: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
    }

    .mini-btn.delete { background: #f9e6eb; border-color: #d7b0bb; color: var(--red); }
    .mini-btn.warn { background: #fff4d9; border-color: #efd69d; color: #8b640b; }
    .mini-btn.success { background: #eaf7ee; border-color: #b8d7c2; color: var(--green); }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 6px;
      background: var(--green);
      box-shadow: 0 0 0 2px rgba(26,123,71,0.18);
    }

    .status-dot.inactive { background: var(--red); box-shadow: 0 0 0 2px rgba(165,49,61,0.18); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px 10px;
      font-size: 13px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 28, 42, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show { display: flex; }

    .modal-box {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 14px;
      border-top: 4px solid var(--gold);
      box-shadow: 0 16px 32px rgba(0,0,0,0.16);
      padding: 20px 18px 16px;
      position: relative;
    }

    .modal-box h3 {
      margin: 0 0 16px;
      font-size: 18px;
      color: var(--navy);
      text-align: center;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--navy);
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      border-radius: 9px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 13px;
      font-family: 'Tajawal', sans-serif;
      color: var(--text);
      background: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--navy);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .brand-header { flex-direction: column; }
      .header-title { order: 3; }
      .brand-box, .header-user { width: 100%; }
      .user-card { flex-wrap: wrap; }
      .user-actions { margin-right: auto; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-links">
      <span class="nav-chip" style="visibility:hidden;">.</span>
    </div>
    <div class="top-right">
      <span class="icon-square"><i class="fa-solid fa-lock"></i></span>
    </div>
  </header>

  <div class="brand-header">
    <div class="brand-box">
      <div class="logo-badge"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="district-label">
        <div>المقاطعة الثانية - قسنطينة</div>
        <div><strong>مفتش التربية</strong></div>
      </div>
    </div>

    <div class="header-title">
      <h1>لوحة التحكم</h1>
      <p>إدارة حسابات الأساتذة ومراقبة النشاطات والمعالجة البيداغوجية</p>
    </div>

    <div class="header-user">
      <div class="user-pill">
        <span class="avatar"><i class="fa-solid fa-user"></i></span>
        <span id="headerUserName">المفتش</span>
      </div>
    </div>
  </div>

  <nav class="subnav">
    <a href="#" class="active"><i class="fa-solid fa-users-gear"></i> إدارة المستخدمين</a>
    <a href="#"><i class="fa-solid fa-chart-line"></i> مراقبة النشاطات</a>
    <a href="#"><i class="fa-solid fa-book-open-reader"></i> المعالجة البيداغوجية</a>
  </nav>

  <main class="page-shell">
    <section class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-users-gear"></i> إدارة الحسابات</h2>
      </div>
      <p class="panel-sub">هذا القسم يتيح إدارة حسابات الأساتذة والمشرفين مع الاحتفاظ بحساب المفتش النشط.</p>

      <div class="action-row">
        <button class="btn btn-green" onclick="openAddUserModal()"><i class="fa-solid fa-user-plus"></i> إضافة أستاذ</button>
        <button class="btn btn-blue" onclick="document.getElementById('csvInput').click()"><i class="fa-solid fa-file-csv"></i> استيراد CSV</button>
        <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="importUsersFromCSV(event)">
        <button class="btn btn-gold" onclick="exportUsersCSV()"><i class="fa-solid fa-download"></i> تصدير CSV</button>
        <button class="btn btn-amber" onclick="downloadCSVTemplate()"><i class="fa-solid fa-file-arrow-down"></i> نموذج CSV</button>
      </div>

      <div id="userList" class="user-list"></div>
    </section>
  </main>

  <div id="userModal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modalTitle">إضافة مستخدم جديد</h3>
      <div class="form-grid">
        <div class="field">
          <label>الاسم الكامل</label>
          <input id="fullName" type="text" placeholder="مثال: أحمد محمد" />
        </div>
        <div class="field">
          <label>اسم المستخدم</label>
          <input id="username" type="text" placeholder="مثال: ahmed_01" />
        </div>
        <div class="field">
          <label>البريد الإلكتروني</label>
          <input id="email" type="email" placeholder="example@mail.com" />
        </div>
        <div class="field">
          <label>المؤسسة</label>
          <input id="school" type="text" placeholder="اسم المؤسسة" />
        </div>
        <div class="field">
          <label>الدور</label>
          <select id="role">
            <option value="teacher">أستاذ</option>
            <option value="supervisor">مشرف</option>
            <option value="inspector">مفتش</option>
          </select>
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input id="password" type="text" placeholder="اتركها فارغة لتوليد كلمة مرور تلقائية" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-green" onclick="saveUser()"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'dashboard_users_v1';
    const inspectorUser = {
      id: 'inspector_001',
      fullName: 'درويش الهلالي',
      username: 'drwisch',
      email: 'drwisch@gmail.com',
      school: 'المفتشية',
      role: 'inspector',
      active: true,
      lastLogin: new Date().toISOString(),
      createdAt: new Date().toISOString()
    };

    function defaultUsers() {
      return [
        { id: 'inspector_001', fullName: 'درويش الهلالي', username: 'drwisch', email: 'drwisch@gmail.com', school: 'المفتشية', role: 'inspector', active: true, lastLogin: new Date().toISOString(), createdAt: new Date().toISOString() },
        { id: 'teacher_1', fullName: 'لمين مناصرة', username: 'amen', email: 'amen@gmail.com', school: 'إعدادية عين مليلة', role: 'teacher', active: true, lastLogin: new Date().toISOString(), createdAt: new Date().toISOString() },
        { id: 'teacher_2', fullName: 'سعيدة عيساوي', username: 'saida', email: 'saida@gmail.com', school: 'متوسطة سيدي علي', role: 'teacher', active: true, lastLogin: new Date(Date.now() - 86400000).toISOString(), createdAt: new Date().toISOString() },
        { id: 'teacher_3', fullName: 'أحمد عمر', username: 'ahmed', email: 'ahmed@gmail.com', school: 'متوسطة ابن رشد', role: 'teacher', active: false, lastLogin: new Date(Date.now() - 4*86400000).toISOString(), createdAt: new Date().toISOString() }
      ];
    }

    function loadUsers() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultUsers()));
          return defaultUsers();
        }
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultUsers()));
          return defaultUsers();
        }
        return parsed;
      } catch (e) {
        return defaultUsers();
      }
    }

    function saveUsers(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDateAr(value) {
      if (!value) return 'لم يسجل بعد';
      const d = new Date(value);
      return d.toLocaleDateString('ar-DZ', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      }) + ' ' + d.toLocaleTimeString('ar-DZ', {
        hour: '2-digit', minute: '2-digit'
      });
    }

    function roleLabel(role) {
      const labels = {
        inspector: 'مفتش',
        teacher: 'أستاذ',
        supervisor: 'مشرف'
      };
      return labels[role] || 'مستخدم';
    }

    function roleClass(role) {
      return role || 'teacher';
    }

    function initials(name) {
      return (name || '').split(' ').filter(Boolean).slice(0,2).map(n => n[0]).join('').toUpperCase() || 'U';
    }

    function renderUsersList() {
      const users = loadUsers();
      const listEl = document.getElementById('userList');
      const inspectorOnly = users.filter(u => u.role === 'inspector');
      const others = users.filter(u => u.role !== 'inspector');
      const ordered = [...inspectorOnly, ...others];

      if (!ordered.length) {
        listEl.innerHTML = '<div class="empty">لا توجد حسابات بعد.</div>';
        return;
      }

      listEl.innerHTML = ordered.map(user => {
        const current = user.id === inspectorUser.id || user.role === 'inspector';
        const activeDot = user.active ? 'status-dot' : 'status-dot inactive';
        const actionButtons = !current ? `
          <button class="mini-btn ${user.active ? 'success' : 'warn'}" onclick="toggleUser('${user.id}')" title="${user.active ? 'تعطيل' : 'تفعيل'}"><i class="fa-solid ${user.active ? 'fa-user-check' : 'fa-user-slash'}"></i></button>
          <button class="mini-btn warn" onclick="resetPassword('${user.id}')" title="إعادة تعيين كلمة المرور"><i class="fa-solid fa-key"></i></button>
          <button class="mini-btn delete" onclick="deleteUser('${user.id}')" title="حذف"><i class="fa-solid fa-trash"></i></button>
        ` : `
          <button class="mini-btn warn" onclick="resetPassword('${user.id}')" title="إعادة تعيين كلمة المرور"><i class="fa-solid fa-key"></i></button>
        `;

        return `
          <div class="user-card">
            <div class="avatar">${escapeHtml(initials(user.fullName))}</div>
            <div class="user-info">
              <div class="user-top">
                <h4 class="user-name">${escapeHtml(user.fullName)}</h4>
                <span class="tag ${roleClass(user.role)}">${escapeHtml(roleLabel(user.role))}</span>
              </div>
              <div class="user-meta">
                <span><i class="fa-solid fa-user"></i> ${escapeHtml(user.username)}</span>
                <span><i class="fa-solid fa-envelope"></i> ${escapeHtml(user.email || 'لا يوجد')}</span>
                <span><i class="fa-solid fa-school"></i> ${escapeHtml(user.school || 'لا يوجد')}</span>
                <span><i class="fa-regular fa-clock"></i> ${escapeHtml(formatDateAr(user.lastLogin))}</span>
                <span><span class="${activeDot}"></span> ${user.active ? 'نشط' : 'غير نشط'}</span>
              </div>
            </div>
            <div class="user-actions">${actionButtons}</div>
          </div>
        `;
      }).join('');
    }

    function openAddUserModal() {
      document.getElementById('modalTitle').textContent = 'إضافة مستخدم جديد';
      document.getElementById('fullName').value = '';
      document.getElementById('username').value = '';
      document.getElementById('email').value = '';
      document.getElementById('school').value = '';
      document.getElementById('role').value = 'teacher';
      document.getElementById('password').value = '';
      document.getElementById('userModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('userModal').classList.remove('show');
    }

    function makePassword(length = 10) {
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      let out = '';
      for (let i = 0; i < length; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function saveUser() {
      const users = loadUsers();
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const school = document.getElementById('school').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value.trim();

      if (!fullName || !username) {
        alert('يرجى إدخال الاسم الكامل واسم المستخدم');
        return;
      }

      const exist = users.some(u => u.username.toLowerCase() === username.toLowerCase());
      if (exist) {
        alert('اسم المستخدم موجود مسبقاً');
        return;
      }

      const newUser = {
        id: 'user_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        fullName,
        username,
        email,
        school,
        role,
        active: true,
        lastLogin: null,
        createdAt: new Date().toISOString()
      };

      users.push(newUser);
      saveUsers(users);
      closeModal();
      renderUsersList();

      if (!password) {
        const gen = makePassword();
        alert(`تمت إضافة المستخدم بنجاح\n\nاسم المستخدم: ${username}\nكلمة المرور: ${gen}`);
      } else {
        alert(`تمت إضافة المستخدم بنجاح\n\nاسم المستخدم: ${username}\nكلمة المرور: ${password}`);
      }
    }

    function toggleUser(id) {
      const users = loadUsers();
      const index = users.findIndex(u => u.id === id);
      if (index === -1) return;
      users[index].active = !users[index].active;
      saveUsers(users);
      renderUsersList();
    }

    function resetPassword(id) {
      const users = loadUsers();
      const user = users.find(u => u.id === id);
      if (!user) return;
      const newPass = makePassword();
      user.lastLogin = new Date().toISOString();
      alert(`تمت إعادة تعيين كلمة المرور\n\nالمستخدم: ${user.fullName}\nاسم المستخدم: ${user.username}\nكلمة المرور الجديدة: ${newPass}`);
      saveUsers(users);
      renderUsersList();
    }

    function deleteUser(id) {
      const users = loadUsers();
      const user = users.find(u => u.id === id);
      if (!user) return;
      if (confirm(`هل تريد حذف المستخدم ${user.fullName}؟`)) {
        const filtered = users.filter(u => u.id !== id);
        saveUsers(filtered);
        renderUsersList();
      }
    }

    function exportUsersCSV() {
      const users = loadUsers();
      const headers = ['الاسم الكامل', 'اسم المستخدم', 'البريد الإلكتروني', 'المؤسسة', 'الدور', 'آخر دخول', 'الحالة'];
      const lines = [headers.join(',')];
      users.forEach(u => {
        lines.push([
          `"${u.fullName || ''}"`,
          `"${u.username || ''}"`,
          `"${u.email || ''}"`,
          `"${u.school || ''}"`,
          `"${roleLabel(u.role)}"`,
          `"${formatDateAr(u.lastLogin)}"`,
          `"${u.active ? 'نشط' : 'غير نشط'}"`
        ].join(','));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'accounts_' + new Date().toISOString().slice(0,10) + '.csv';
      link.click();
    }

    function importUsersFromCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          const rows = text.split(/\r?\n/).map(row => row.trim()).filter(Boolean);
          if (rows.length < 2) {
            alert('الملف لا يحتوي على بيانات');
            return;
          }
          const users = loadUsers();
          for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
            if (cols.length < 5) continue;
            const [fullName, username, email, school, role] = cols;
            if (!fullName || !username) continue;
            const exists = users.some(u => u.username.toLowerCase() === username.toLowerCase());
            if (exists) continue;
            users.push({
              id: 'user_' + Date.now() + '_' + i,
              fullName,
              username,
              email,
              school,
              role: role === 'مفتش' ? 'inspector' : role === 'مشرف' ? 'supervisor' : 'teacher',
              active: true,
              lastLogin: null,
              createdAt: new Date().toISOString()
            });
          }
          saveUsers(users);
          renderUsersList();
          alert('تم استيراد الحسابات بنجاح');
        } catch (err) {
          console.error(err);
          alert('حدث خطأ أثناء قراءة الملف');
        }
        event.target.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    function downloadCSVTemplate() {
      const csv = 'الاسم الكامل,اسم المستخدم,البريد الإلكتروني,المؤسسة,الدور\nأحمد محمد,ahmed,ahmed@mail.com,مدرسة مثال,أستاذ\nسارة علي,sara,sara@mail.com,مدرسة مثال,مشرف';
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'template_accounts.csv';
      a.click();
    }

    document.addEventListener('DOMContentLoaded', function () {
      const users = loadUsers();
      const inspector = users.find(u => u.role === 'inspector') || inspectorUser;
      document.getElementById('headerUserName').textContent = inspector.fullName || 'المفتش';
      renderUsersList();
    });
  </script>
</body>
</html>
