<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ركن الكتابة الهادفة - الوجيه في الإشراف التربوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root { --primary: #0e2744; --gold: #c49b3f; --gold-light: #fce8bd; --bg-body: #faf7ef; --text-dark: #152238; --text-muted: #5d6b7b; --border-color: #d9ceb4; --shadow: 0 6px 20px rgba(14,39,68,0.08); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-body); color: var(--text-dark); line-height: 1.8; background-image: radial-gradient(circle at 50% 0%, rgba(196,155,63,0.12) 0%, transparent 60%), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><defs><pattern id='islamic-dash' width='80' height='80' patternUnits='userSpaceOnUse'><g fill='none' stroke='%23c49b3f' stroke-width='0.6' opacity='0.15'><path d='M40 16 L47 27 L60 20 L57 34 L71 39 L60 48 L68 60 L54 61 L51 75 L40 66 L29 75 L26 61 L12 60 L20 48 L9 39 L23 34 L20 20 L33 27 Z'/></g></pattern></defs><rect width='80' height='80' fill='url(%23islamic-dash)'/></svg>"); background-attachment: fixed; }
    .top-bar { background: linear-gradient(135deg, #091c33, #0e2744); color: #f7e7c4; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); flex-wrap: wrap; gap: 10px;}
    .top-bar a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; background: rgba(196,155,63,0.2); padding: 6px 14px; border-radius: 7px; border: 1px solid var(--gold); transition: 0.2s;}
    .top-bar a:hover { background: var(--gold); color: #091c33; }
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h1 { font-family: 'Amiri', serif; font-size: clamp(26px, 4vw, 38px); color: var(--primary); margin-bottom: 8px; }
    .hero p { color: var(--text-muted); font-size: 14.5px; max-width: 600px; margin: 0 auto; }
    .filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0 30px; }
    .filter-btn { padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--border-color); background: #fff; color: var(--text-dark); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .filter-btn:hover, .filter-btn.active { background: var(--primary); color: var(--gold-light); border-color: var(--gold); }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .card { background: #fff; border: 1px solid var(--border-color); border-top: 3.5px solid var(--gold); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(196,155,63,0.15); }
    .card-img { width: 100%; height: 180px; object-fit: cover; background: #eef3f9; }
    .card-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .card-tag { font-size: 11px; font-weight: 800; color: var(--gold-deep); background: #fce8bd; padding: 3px 10px; border-radius: 12px; align-self: flex-start; margin-bottom: 10px; }
    .card-title { font-family: 'Amiri', serif; font-size: 20px; color: var(--primary); margin-bottom: 10px; line-height: 1.4; }
    .card-excerpt { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: auto; flex-wrap: wrap; gap: 10px;}
    .card-author { font-weight: 700; color: var(--primary); }
    .btn-read { background: var(--primary); color: #fff; border: none; padding: 7px 15px; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block;}
    .btn-read:hover { background: var(--gold); color: var(--navy-deep); }
    .note-badge { background:#fff3cd; color:#856404; font-size:11px; padding:4px 8px; border-radius:5px; margin-bottom:8px; text-align:center; width:100%; font-weight:700;}
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(9,28,51,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; position: relative; border-top: 5px solid var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .modal-close { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .modal-close:hover { background: var(--gold); color: var(--navy-deep); }
    .modal-header-img { width: 100%; max-height: 350px; object-fit: cover; }
    .modal-body { padding: 30px 40px; }
    .modal-category { color: var(--gold-deep); font-weight: 800; font-size: 13px; margin-bottom: 5px; display: block; }
    .modal-title { font-family: 'Amiri', serif; font-size: 32px; color: var(--primary); margin-bottom: 15px; line-height: 1.3; }
    .modal-author-info { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed var(--border-color); }
    .author-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--gold-light); color: var(--gold-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; border: 2px solid var(--gold); }
    .author-details h4 { color: var(--primary); font-size: 15px; margin: 0; }
    .author-details p { color: var(--text-muted); font-size: 12px; margin: 0; }
    .modal-content-text { font-size: 16px; line-height: 2; color: var(--text-dark); white-space: pre-wrap; margin-bottom: 30px; text-align: justify; }
    .media-container { margin-bottom: 30px; }
    .media-container iframe { width: 100%; min-height: 400px; border-radius: 10px; border: 2px solid var(--border-color); }
    .author-bio-box { background: #faf7ef; border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; margin-top: 30px; }
    .author-bio-box h4 { color: var(--primary); font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .author-bio-box p { font-size: 13px; color: var(--text-muted); margin: 0; }
    .loader { text-align: center; padding: 50px; color: var(--text-muted); font-size: 16px; grid-column: 1/-1; }
</style>
</head>
<body>

<div class="top-bar">
    <div><i class="fas fa-feather-alt" style="color:var(--gold); margin-left:5px;"></i> ركن الكتابة الهادفة</div>
    <div style="display:flex; gap:10px;">
        <a href="submit-article.html"><i class="fas fa-pen-nib"></i> إرسال مقال جديد</a>
        <a href="index.html"><i class="fas fa-arrow-right"></i> البوابة الرئيسية</a>
    </div>
</div>

<div class="hero">
    <h1>ركن الكتابة الهادفة</h1>
    <p>فضاء صحفي يستقبل إبداعات الأساتذة في مجالات الأدب، البيداغوجيا، والشأن التربوي.</p>
</div>

<div class="container">
    <div class="filters">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="adab">الأدب</button>
        <button class="filter-btn" data-filter="bida">البيداغوجيا</button>
        <button class="filter-btn" data-filter="chaan">الشأن التربوي</button>
    </div>
    <div class="grid" id="articlesGrid">
        <div class="loader"><i class="fas fa-spinner fa-spin"></i> جارٍ تحميل المقالات...</div>
    </div>
</div>

<div class="modal-overlay" id="articleModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeArticle()">&times;</button>
        <img id="modalImg" class="modal-header-img" src="" alt="غلاف المقال" style="display:none;">
        <div class="modal-body">
            <span class="modal-category" id="modalCategory"></span>
            <h1 class="modal-title" id="modalTitle"></h1>
            <div class="modal-author-info">
                <div class="author-avatar" id="modalAvatar">ك</div>
                <div class="author-details">
                    <h4 id="modalAuthorName"></h4>
                    <p id="modalDate"></p>
                </div>
            </div>
            <div class="modal-content-text" id="modalContent"></div>
            <div class="media-container" id="modalMedia"></div>
            <div class="author-bio-box" id="modalBioBox" style="display:none;">
                <h4><i class="fas fa-user-pen"></i> نبذة عن الكاتب</h4>
                <p id="modalBio"></p>
            </div>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://yzxyttieobyblznaehcl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JE7zHZ97cZ92gUALD0II-w_j04eEo2u";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let articlesData = [];
let currentFilter = 'all';

async function fetchArticles() {
    const grid = document.getElementById('articlesGrid');
    grid.innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i> جارٍ تحميل المقالات...</div>';
    try {
        const { data, error } = await sb.from('sahafa_articles').select('*').eq('status', 'published').order('created_at', { ascending: false });
        if (error) throw error;
        articlesData = data || [];
        renderArticles();
    } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="loader" style="color:var(--danger);">تعذر تحميل المقالات.</div>';
    }
}

function renderArticles() {
    const grid = document.getElementById('articlesGrid');
    grid.innerHTML = '';
    const filtered = currentFilter === 'all' ? articlesData : articlesData.filter(a => a.category === currentFilter);
    if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-muted); grid-column: 1/-1; padding:40px;">لا توجد مقالات منشورة في هذا التصنيف حالياً.</p>';
        return;
    }
    const categoryLabels = { adab: 'أدب', bida: 'بيداغوجيا', chaan: 'شأن تربوي' };
    filtered.forEach(article => {
        const initials = article.author_name.split(' ').map(w => w[0]).slice(0, 2).join('');
        const card = document.createElement('div');
        card.className = 'card';
        let imgHtml = `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#ccc;font-size:40px;"><i class="fas fa-feather-alt"></i></div>`;
        if (article.cover_image_url) {
            imgHtml = `<img src="${article.cover_image_url}" class="card-img" alt="${article.title}" loading="lazy" onerror="this.style.display='none'">`;
        }
        let noteHtml = '';
        let editBtnHtml = '';
        if (article.admin_notes) {
            noteHtml = `<div class="note-badge">📝 لديك ملاحظة من المفتش</div>`;
            editBtnHtml = `<a href="edit-article.html?id=${article.id}" class="btn-read" style="background:var(--gold); color:#000; margin-right:5px;"><i class="fas fa-edit"></i> تعديل</a>`;
        }
        card.innerHTML = `
            ${imgHtml}
            <div class="card-content">
                <span class="card-tag">${categoryLabels[article.category] || article.category}</span>
                <h2 class="card-title">${article.title}</h2>
                <p class="card-excerpt">${article.excerpt || article.content.substring(0, 100) + '...'}</p>
                ${noteHtml}
                <div class="card-meta">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div style="width:28px; height:28px; border-radius:50%; background:var(--gold-light); color:var(--gold-deep); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; border:1px solid var(--gold);">${initials}</div>
                        <span class="card-author">${article.author_name}</span>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-read" onclick="openArticle('${article.id}')"><i class="fas fa-book-open"></i> قراءة</button>
                        ${editBtnHtml}
                    </div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openArticle(id) {
    const article = articlesData.find(a => a.id === id);
    if (!article) return;
    const categoryLabels = { adab: 'أدب', bida: 'بيداغوجيا', chaan: 'شأن تربوي' };
    const modalImg = document.getElementById('modalImg');
    if (article.cover_image_url) { modalImg.src = article.cover_image_url; modalImg.style.display = 'block'; } else { modalImg.style.display = 'none'; }
    document.getElementById('modalCategory').textContent = categoryLabels[article.category] || article.category;
    document.getElementById('modalTitle').textContent = article.title;
    document.getElementById('modalContent').textContent = article.content;
    const initials = article.author_name.split(' ').map(w => w[0]).slice(0, 2).join('');
    document.getElementById('modalAvatar').textContent = initials;
    document.getElementById('modalAuthorName').textContent = article.author_name;
    document.getElementById('modalDate').textContent = new Date(article.created_at).toLocaleDateString('ar-DZ', { year: 'numeric', month: 'long', day: 'numeric' });
    const bioBox = document.getElementById('modalBioBox');
    if (article.author_bio) { document.getElementById('modalBio').textContent = article.author_bio; bioBox.style.display = 'block'; } else { bioBox.style.display = 'none'; }
    const mediaContainer = document.getElementById('modalMedia');
    mediaContainer.innerHTML = '';
    if (article.video_url) {
        let videoUrl = article.video_url;
        if (videoUrl.includes('youtube.com/watch?v=')) videoUrl = videoUrl.replace('watch?v=', 'embed/');
        else if (videoUrl.includes('youtu.be/')) videoUrl = videoUrl.replace('youtu.be/', 'youtube.com/embed/');
        mediaContainer.innerHTML = `<h4 style="color:var(--primary); margin-bottom:10px; font-size:15px;"><i class="fas fa-video"></i> مرفق فيديو:</h4><iframe src="${videoUrl}" frameborder="0" allowfullscreen></iframe>`;
    }
    document.getElementById('articleModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeArticle() {
    document.getElementById('articleModal').classList.remove('active');
    document.body.style.overflow = 'auto';
}

document.getElementById('articleModal').addEventListener('click', function(e) { if (e.target === this) closeArticle(); });

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderArticles();
    });
});

document.addEventListener('DOMContentLoaded', fetchArticles);
</script>
</body>
</html>
